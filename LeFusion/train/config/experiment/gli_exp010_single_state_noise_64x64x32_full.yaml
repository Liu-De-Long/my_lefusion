# @package _global_
defaults:
  - override /dataset: gli
  - _self_

experiment_id: 20260807_exp010_gli_single_state_noise
variant: patch_64x64x32_seed_20260805_full_50k_2gpu
seed: 20260805

formal_training:
  enabled: true
  effective_batch_size: 4
  repetition_seeds: [20260805]
  run_initial_seed_only: true

inpainting_training:
  enabled: true
  target: single_t1c
  spatial_condition: masked_t1c_plus_four_channel_lesion_mask
  fill_value: 0.0
  histogram_condition: four_by_16_bins

lesion_generation:
  enabled: true
  state_mode: full_t1c
  objective: pred_noise
  condition_dropout_prob: 0.1
  hist_loss_weight: 0.0
  hist_loss_ramp_steps: 0

dataset:
  data_type: gli
  root_dir: /workspace/LeFusion_v2/dataset/brats2024_gli_t1c_local_patches
  patch_size_xyz: [64, 64, 32]
  split: train
  split_file: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/splits_v2.json
  image_channels: 1
  lesion_channels: 4
  hist_bins: 16
  cond_dim: 64

sampler:
  enabled: true
  name: gli_anchor_role_subject
  seed: ${seed}
  samples_per_epoch: 7772
  drop_last: true

model:
  diffusion_img_size: 64
  diffusion_depth_size: 32
  spatial_shape_dhw: [32, 64, 64]
  base_dim: 64
  temporal_max_distance: 128
  diffusion_num_channels: 1
  spatial_condition_channels: 5
  cond_dim: 64
  gpus: 0
  data_parallel: true
  data_parallel_device_ids: [0, 1]
  batch_size: 4
  gradient_accumulate_every: 1
  num_workers: 8
  train_lr: 1e-4
  train_num_steps: 50000
  amp: true
  amp_dtype: bfloat16
  max_grad_norm: 1.0
  ema_decay: 0.995
  results_folder: experiments/20260807_exp010_gli_single_state_noise/outputs/full_50k_2gpu/seed_20260805/checkpoints

validation:
  enabled: true
  split: val
  every_steps: 2000
  batch_size: 4
  num_workers: 8
  seed: 20260850
  metric: val/ema/total_loss
  early_stopping:
    warmup_steps: 10000
    patience: 8
    relative_min_delta: 0.005

checkpoint:
  latest_every_steps: 500
  milestone_every_steps: 5000
  keep_milestones: 3
  resume_from: null

wandb:
  enabled: true
  fail_closed: true
  project: lefusion-brats2024-gli
  entity: jinyuanbao719-xi-an-jiaotong-university-
  run_name: exp010-p64-full50k-2gpu-s20260805
  run_id: exp010-p64-full50k-2gpu-s20260805
  resume: never
  mode: online
  dir: experiments/20260807_exp010_gli_single_state_noise/outputs/full_50k_2gpu/seed_20260805/wandb

preflight:
  run_id: exp010-p64-full50k-2gpu-preflight-s20260805-r1
  run_name: exp010-p64-full50k-2gpu-preflight-s20260805-r1
  output_dir: experiments/20260807_exp010_gli_single_state_noise/outputs/full_50k_2gpu/preflight
  use_data_parallel: true
