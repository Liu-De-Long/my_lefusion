data_type: gli
experiment_id: 20260811_exp019_gli_exp010_pseudomask_test200_comparison
variant: test200_base
device: cuda:0

lesion_generation:
  enabled: true
  state_mode: full_t1c
  objective: pred_noise
  condition_dropout_prob: 0.1
  hist_loss_weight: 0.0
  hist_loss_ramp_steps: 0

dataset:
  data_type: gli
  root_dir: /workspace/LeFusion_v2/dataset/brats2024_gli_t1c_local_patches
  raw_root_dir: /workspace/LeFusion-main/BraTS-2024-Complete/BraTS-GLI
  raw_source_split: train
  patch_size_xyz: [64, 64, 32]
  split: test
  split_file: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/splits_v2.json
  batch_size: 4
  num_workers: 4
  hist_bins: 16

model:
  denoising_fn: Unet3D
  diffusion_img_size: 64
  diffusion_depth_size: 32
  spatial_shape_dhw: [32, 64, 64]
  base_dim: 64
  temporal_max_distance: 128
  diffusion_num_channels: 1
  spatial_condition_channels: 5
  cond_dim: 64
  dim_mults: [1, 2, 4, 8]
  timesteps: 300
  loss_type: l1
  amp: false
  amp_dtype: bfloat16

checkpoint:
  path: ???
  weights_key: ema

conditioning:
  source: real
  selection: nearest
  clusters_path: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/outputs/patch_64x64x32/clusters/centers.json
  hist_perturb_std: 0.0

input_policy:
  mask_inside_lesion: true
  fill_value: 0.0
  lesion_mode: original_multilabel

selection:
  manifest_path: /workspace/LeFusion_v2/my_experiment/experiments/20260811_exp019_gli_exp010_pseudomask_test200_comparison/outputs/test200_manifest.json
  shard_index: 0
  shard_count: 2

sampling:
  seed: 20260806
  cond_scale: 2.0

repaint:
  method: single_state_conditional_repaint
  background_noise: fresh_per_reverse_call
  post_sample_background_restore: true
  show_progress: false
  inpa_inj_sched_prev_cumnoise: false
  schedule_jump_params:
    t_T: 300
    n_sample: 1
    jump_length: 1
    jump_n_sample: 1

output:
  root: ???
  max_batches: null
  overwrite: false
  resume: true
  save_nifti: false
  save_qa: false
  memory_growth_tolerance_mib: 256

hydra:
  job: {chdir: false}
  run: {dir: .}
