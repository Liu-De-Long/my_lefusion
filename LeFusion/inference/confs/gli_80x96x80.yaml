data_type: gli
experiment_id: 20260805_exp004_gli_inference_closed_loop
variant: patch_80x96x80_cluster_smoke
device: cuda:0

dataset:
  data_type: gli
  root_dir: /workspace/LeFusion_v2/dataset/brats2024_gli_t1c_local_patches
  raw_root_dir: /workspace/LeFusion-main/BraTS-2024-Complete/BraTS-GLI
  raw_source_split: train
  patch_size_xyz: [80, 96, 80]
  split: test
  split_file: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/splits_v2.json
  batch_size: 1
  num_workers: 0

model:
  denoising_fn: Unet3D
  diffusion_img_size: 64
  diffusion_depth_size: 80
  spatial_shape_dhw: [80, 80, 96]
  base_dim: 64
  temporal_max_distance: 128
  diffusion_num_channels: 4
  cond_dim: 64
  dim_mults: [1, 2, 4, 8]
  timesteps: 300
  loss_type: l1
  amp: true

checkpoint:
  path: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/outputs/patch_80x96x80/checkpoints/validation_80x96x80.pt
  weights_key: model

conditioning:
  source: cluster
  selection: nearest
  clusters_path: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/outputs/patch_80x96x80/clusters/centers.json
  hist_perturb_std: 0.0

repaint:
  show_progress: true
  inpa_inj_sched_prev_cumnoise: false
  schedule_jump_params:
    t_T: 5
    n_sample: 1
    jump_length: 1
    jump_n_sample: 1

output:
  root: /workspace/LeFusion_v2/my_experiment/experiments/20260805_exp004_gli_inference_closed_loop/outputs/patch_80x96x80/inference_cluster
  max_batches: 1
  overwrite: false

hydra:
  job:
    chdir: false
  run:
    dir: .
